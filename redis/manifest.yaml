
apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: redis-deploy
  namespace: roboshop
  labels: 
    project: roboshop
    env: dev
    purpose: Deployment 
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev
      component: redis
    
  template:
    metadata:
      labels:
        project: roboshop
        env: dev
        component: redis

    spec:
      containers:
      - name: redis
        image: redis:7
        resources:
          requests:
            cpu: "120m"
            memory: "130Mi"
          limits:
            cpu: "150m"
            memory: "150Mi"


---
apiVersion: v1
kind: Service 
metadata: 
  name: redis-service
  namespace: roboshop
  labels:
    project: roboshop
    env: dev
    purpose: service 
spec:
  selector:
    project: roboshop
    env: dev
    component: redis

  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379



